execution:
  concurrent_model_requests: 1
  candidates_per_round: 1
  max_candidate_rounds: 4
  max_model_calls: 12
  mandatory_clean_audits_before_success: 2

verification:
  run_acceptance_checks_on_every_candidate: true
  rerun_checks_before_success: true
  allow_model_scores_to_override_failed_checks: false

memory:
  fresh_request_for_each_role: true
  retain_transcript_in_model_context: false
  retain_snapshots_on_disk: true
  silently_truncate_required_context: false
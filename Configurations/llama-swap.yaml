# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 240
globalTTL: 1200
logLevel: info
logToStdout: proxy
captureBuffer: 0
startPort: 10001
sendLoadingState: true
includeAliasesInList: false

macros:
  "bin": "llama-server"
  "root": "/Users/pedroamaral/models"
  "cloud": "/Users/pedroamaral/Documents"
  "basic": "--tools all --ui-mcp-proxy"
  "image": "--image-min-tokens 1024"
  "config": "--ui-config-file ${cloud}/AI-Config/ui-config.json"
  "cache": "--cache-type-k q8_0 --cache-type-v q8_0"
  "agent": "${basic} --mcp-servers-config ${cloud}/AI-Config/mcp-local.json"
  "preset": "--jinja -ngl 99 --flash-attn on --parallel 1 --reasoning-preserve"
  "dflash": "-md ${root}/.muse_dflash-kquant.gguf -ngl-draft 99"

models:

  qwen-3.5-4b:
    name: "Qwen 3.5 4B (Agent)"
    aliases: ["Qwen 4B Agent"]
    description: "Agentic Tiny Text-image model"
    capabilities:
      in: [text, image]
      out: [text]
      context: 98304
      tools: true
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        min_p: 0.05
        repeat_penalty: 1.05
        reasoning_budget: 20000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.5-4B-Uncensored-Q6K.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-4b.gguf ${image}
      ${preset} ${cache} --ctx-size 98304
    ttl: 900
    unloadTimeout: 30

  ling-9B:
    name: "Ling Tiny 9B"
    aliases: ["Ling Tiny 9B"]
    description: "Text model / 98k ctx"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 98304
    filters:
      setParams:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        reasoning_budget: 20000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ling-3-tiny.gguf ${agent}
      ${preset} ${cache} --ctx-size 98304 
    ttl: 1000
    unloadTimeout: 35

  ornith-1.5-9b:
    name: "Ornith 1.5 9B (Release)"
    aliases: ["Ornith 9b Release"]
    description: "Text-image model / 98k ctx"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 98304
    filters:
      setParams:
        temperature: 0.60
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        reasoning_budget: 20000
        presence_penalty: 0.0
        repeat_penalty: 1.00
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ornith-1.5-9b.gguf ${agent}
      --mmproj ${root}/.mmproj-ornith-1.5-9b.gguf ${image}
      ${preset} ${cache} --ctx-size 70800 
    ttl: 1000
    unloadTimeout: 25

  ornith-1.5-9B:
    name: "Ornith 1.5 9B (Update)"
    aliases: ["Ornith 9B Update"]
    description: "Text-image model / 98k ctx"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 98304
    filters:
      setParams:
        temperature: 0.60
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        reasoning_budget: 20000
        presence_penalty: 1.5
        repeat_penalty: 1.00
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ornith-1.5-9B-Q8.gguf ${agent}
      --mmproj ${root}/.mmproj-Ornith-1.5-9B-update ${image}
      ${preset} ${cache} --ctx-size 98304 
    ttl: 1000
    unloadTimeout: 35

  laguna:
    name: "Laguna MoE (Agent)"
    aliases: ["Laguna Agent"]
    description: "Agentic MoE text model (temp 0.7 - 70k ctx)"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 98304
    filters:
      setParams:
        temperature: 0.70
        top_k: 20
        reasoning_budget: 20000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT}
      -m ${root}/laguna-XS-2.1-IQ3M.gguf ${config}
      ${preset} ${cache} --ctx-size 98304 ${agent}
    unloadTimeout: 40

  ornith-1.5-a3b:
    name: "Ornith 1.5 A3B (Basic)"
    aliases: ["Ornith A3B"]
    description: "Image-text MoE / 70k cxt"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 70800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        reasoning_budget: 16300
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ornith-1.5-35B-A3B-Uncensored-IQ3M.gguf
      --mmproj ${root}/.mmproj-ornith-1.5-35B-A3B.gguf ${image}
      ${cache} --ctx-size 70800 ${basic}
    unloadTimeout: 55

  ornith-1.5-A3B:
    name: "Ornith 1.5 A3B (Agent)"
    aliases: ["Ornith A3B Agent"]
    description: "Image-text MoE / 98k cxt"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 98304
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        reasoning_budget: 20400
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ornith-1.5-35B-A3B-Uncensored-IQ3M.gguf
      --mmproj ${root}/.mmproj-ornith-1.5-35B-A3B.gguf ${image}
      ${preset} ${cache} --ctx-size 98304 ${agent}
    unloadTimeout: 60

  qwen-3.8-27b:
    name: "Qwen 3.8 (Agent - Low)"
    aliases: ["Qwen 3.8 Low"]
    description: "Text-image model / temp 0.6"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 45500
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0.1
        reasoning_budget: 20400
        chat_template_kwargs:
          reasoning_effort: low
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.8-27B-heretic-IQ3M.gguf
      ${preset} ${cache} ${agent} --ctx-size 45500
    unloadTimeout: 70

  qwen-3.8-27B:
    name: "Qwen 3.8 (Agent - Medium)"
    aliases: ["Qwen 3.8 Medium"]
    description: "Text-image model / temp 0.4, kv q5_1"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 70800
    filters:
      setParams:
        temperature: 0.4
        top_p: 0.90
        top_k: 15
        min_p: 0.02
        reasoning_budget: 20000
        presence_penalty: 0.0
        repeat_penalty: 1.0
        chat_template_kwargs:
          reasoning_effort: medium
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.8-27B-heretic-IQ3M.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-3.8-27b.gguf ${image}
      ${preset} --ctx-size 70800 --cache-type-k q5_1 --cache-type-v q5_1
    unloadTimeout: 80

  qwen-3.8-27B-high:
    name: "Qwen 3.8 (Agent - High)"
    aliases: ["Qwen 3.8 High"]
    description: "Text-image model / temp 0.4, kv q5_1"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 70800
    filters:
      setParams:
        temperature: 0.4
        top_p: 0.90
        top_k: 15
        min_p: 0.02
        reasoning_budget: 20000
        presence_penalty: 0.0
        repeat_penalty: 1.0
        chat_template_kwargs:
          reasoning_effort: high
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.8-27B-heretic-IQ3M.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-3.8-27b.gguf ${image}
      ${preset} --ctx-size 70800 --cache-type-k q5_1 --cache-type-v q5_1
    unloadTimeout: 80

  meta-glimmer-30b:
    name: "Meta Muse Glimmer (Agent)"
    aliases: ["Glimmer Agent"]
    description: "Text model / 32k ctx, reason. high"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 32600
    filters:
      setParams:
        temperature: 0.65
        top_p: 0.95
        top_k: 64
        reasoning_budget: 8400
        chat_template_kwargs:
          reasoning_strength: high
    cmd: |
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/muse-glimmer-30B-heretic-Q4KL.gguf ${dflash}
      ${cache} --ctx-size 32600 ${agent} 
    ttl: 900
    unloadTimeout: 85

  meta-glimmer-30B:
    name: "Meta Muse Glimmer (Basic)"
    aliases: ["Glimmer Chat"]
    description: "Text model / 45k ctx, reason. xhigh"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 45500
    filters:
      setParams:
        temperature: 1.0
        top_p: 0.95
        top_k: 64
        reasoning_budget: 20400
        chat_template_kwargs:
          reasoning_strength: xhigh
    cmd: |
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/muse-glimmer-30B-heretic-Q4KL.gguf ${dflash} 
      ${cache} --ctx-size 45500 ${basic}
    ttl: 900
    unloadTimeout: 80

matrix:
  vars:
    q4b: qwen-3.5-4b
    o9a: ornith-1.5-9b
    o9c: ornith-1.5-9B
    l3t: ling-9B
    lxs: laguna
    o3c: ornith-1.5-a3b
    o3a: ornith-1.5-A3B
    q8a: qwen-3.8-27b
    q8b: qwen-3.8-27B
    q8c: qwen-3.8-27B-high
    mga: meta-glimmer-30b
    mgc: meta-glimmer-30B

  sets:
    main: "(q4b | l3t | o3a | o3c)"
    mix: "(lxs | o3c | o3a | o9c | o9a)"
    max: "(q8a | q8b | q8c | mga | mgc)"
  evict_costs:
    q4b: 1
    l3t: 3
    o9a: 3
    o9c: 3
    o3c: 7
    o3a: 7
    lxs: 3
    q8a: 9
    q8b: 9
    q8c: 9
    mga: 9
    mgc: 9

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build HTML Site
        shell: bash
        run: |
          mkdir -p _site

          # Copy directory hierarchy with only .html files into _site
          find . -type f -name '*.html' ! -name 'index.html' ! -path './.*' ! -path './_site/*' | while read -r file; do
            dest="_site/${file#./}"
            mkdir -p "$(dirname "$dest")"
            cp "$file" "$dest"
          done

          # Collect staged relative html files
          cd _site
          html_files=$(find . -type f -name '*.html' ! -name 'index.html' | sed 's|^\./||' | sort)

          # Generate index.html
          cat <<'EOF' > index.html
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AI Research Hub – HTML Index</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; line-height: 1.6; }
              ul { list-style: square; padding-left: 1.2rem; }
              a { color: #0969da; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>HTML Documents</h1>
            <ul>
          EOF

          if [ -z "$html_files" ]; then
            echo "      <li><em>No HTML pages found.</em></li>" >> index.html
          else
            while IFS= read -r f; do
              [ -n "$f" ] && printf '      <li><a href="%s">%s</a></li>\n' "$f" "$f" >> index.html
            done <<< "$html_files"
          fi

          cat <<'EOF' >> index.html
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
